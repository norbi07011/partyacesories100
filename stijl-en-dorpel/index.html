<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stijl & Dorpel – Deuren en kozijnen vervangen, inmeten en monteren</title>
    <meta name="description" content="Stijl & Dorpel vervangt binnendeuren, buitendeuren en kozijnen in heel Nederland. Kies je model, stel je deur samen, laat gratis inmeten en wij monteren." />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0b0a09" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Stijl & Dorpel – Deuren & kozijnen" />
    <meta property="og:description" content="Binnendeuren, buitendeuren en kozijnen: kiezen, inmeten, maken en monteren door één partij." />
    <meta property="og:site_name" content="Stijl & Dorpel" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      try { var l = localStorage.getItem('sd-lang'); if (l) document.documentElement.lang = l.toLowerCase(); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <!-- Statische kopie van het formulier zodat Netlify Forms het herkent in deze SPA. -->
    <form name="offerte" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input name="bot-field" /><input name="soort" /><input name="naam" /><input name="email" />
      <input name="telefoon" /><input name="postcode" /><input name="plaats" /><input name="aantal" />
      <textarea name="bericht"></textarea><textarea name="offertelijst"></textarea>
    </form>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
