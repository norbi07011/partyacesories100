<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Party Accessoires Verhuur</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        font-family: "Plus Jakarta Sans", sans-serif;
        background-color: #050505;
        color: #ffffff;
        overflow-x: hidden;
      }
      .font-display {
        font-family: "Space Grotesk", sans-serif;
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .neon-glow-pink {
        box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
      }
      .neon-glow-blue {
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
      }
      .neon-glow-purple {
        box-shadow: 0 0 20px rgba(168, 85, 247, 0.3);
      }
      .animate-float {
        animation: float 6s ease-in-out infinite;
      }
      @keyframes float {
        0%,
        100% {
          transform: translateY(0px);
        }
        50% {
          transform: translateY(-20px);
        }
      }
      .gradient-text {
        background: linear-gradient(to right, #ec4899, #8b5cf6, #3b82f6);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #222;
        border-radius: 10px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #333;
      }
      .custom-scrollbar::-webkit-scrollbar {
        width: 6px;
      }
      .custom-scrollbar::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(236, 72, 153, 0.5);
        border-radius: 10px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: rgba(236, 72, 153, 0.7);
      }

      /* ── Premium Scroll Effects ─────────────────────────────── */

      html { scroll-behavior: smooth; }

      /* Fix missing gradient-shift keyframe (used by animated border) */
      @keyframes gradient-shift {
        0%, 100% { background-position: 0% 50%; }
        50%       { background-position: 100% 50%; }
      }

      /* ── Reveal base ── */
      .reveal {
        opacity: 0;
        transform: translateY(54px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-left {
        opacity: 0;
        transform: translateX(-70px) translateY(20px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-right {
        opacity: 0;
        transform: translateX(70px) translateY(20px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-scale {
        opacity: 0;
        transform: scale(0.88) translateY(30px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1),
                    transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .reveal-blur {
        opacity: 0;
        filter: blur(12px) brightness(0.6);
        transform: translateY(20px);
        transition: opacity 1s ease, filter 1s ease, transform 1s ease;
      }

      .reveal.visible,
      .reveal-left.visible,
      .reveal-right.visible,
      .reveal-scale.visible {
        opacity: 1;
        transform: translateY(0) translateX(0) scale(1);
      }
      .reveal-blur.visible {
        opacity: 1;
        filter: blur(0) brightness(1);
        transform: translateY(0);
      }

      /* ── Stagger delays ── */
      .reveal-d1 { transition-delay: 0.08s; }
      .reveal-d2 { transition-delay: 0.16s; }
      .reveal-d3 { transition-delay: 0.24s; }
      .reveal-d4 { transition-delay: 0.32s; }
      .reveal-d5 { transition-delay: 0.40s; }
      .reveal-d6 { transition-delay: 0.48s; }

      /* ── Hero word-reveal (mount animation) ── */
      @keyframes hero-word-up {
        from { opacity: 0; transform: translateY(110%); }
        to   { opacity: 1; transform: translateY(0); }
      }
      .hero-word-wrap {
        overflow: hidden;
        display: inline-block;
        vertical-align: bottom;
      }
      .hero-word {
        display: inline-block;
        animation: hero-word-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
      }

      /* ── Section title line-reveal ── */
      @keyframes line-grow {
        from { transform: scaleX(0); transform-origin: left; }
        to   { transform: scaleX(1); transform-origin: left; }
      }
      .line-reveal {
        transform: scaleX(0);
        transform-origin: left;
        transition: transform 1.1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .line-reveal.visible { transform: scaleX(1); }

      /* ── Parallax helper ── */
      .parallax-bg { will-change: transform; }

      /* ── Animated gradient text (premium) ── */
      @keyframes gradient-flow {
        0%, 100% { background-position: 0% 50%; }
        50%       { background-position: 100% 50%; }
      }
      .gradient-text-flow {
        background: linear-gradient(270deg, #ec4899, #8b5cf6, #3b82f6, #06b6d4, #ec4899);
        background-size: 400% 400%;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        animation: gradient-flow 5s ease infinite;
      }

      /* ── Card 3D tilt (CSS-only) ── */
      .card-tilt {
        transform-style: preserve-3d;
        transition: transform 0.4s ease, box-shadow 0.4s ease;
      }
      .card-tilt:hover { transform: perspective(800px) rotateY(-4deg) rotateX(2deg) translateY(-6px); }

      /* ── Neon border pulse on CTA ── */
      @keyframes neon-pulse {
        0%, 100% { box-shadow: 0 0 20px rgba(236,72,153,0.3), 0 0 40px rgba(236,72,153,0.1); }
        50%       { box-shadow: 0 0 40px rgba(236,72,153,0.7), 0 0 80px rgba(139,92,246,0.4), 0 0 120px rgba(59,130,246,0.2); }
      }
      .animate-neon-pulse { animation: neon-pulse 2.5s ease-in-out infinite; }

      /* ── Floating particles (CSS only, no JS) ── */
      @keyframes particle-rise {
        0%   { transform: translateY(0)    translateX(0)    scale(1);   opacity: 0.7; }
        100% { transform: translateY(-80px) translateX(30px) scale(0.2); opacity: 0; }
      }
      .particle {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        animation: particle-rise linear infinite;
      }

      /* ── Scroll-fade for subsection bg overlays ── */
      @keyframes section-fade-in {
        from { opacity: 0; transform: translateY(30px); }
        to   { opacity: 1; transform: translateY(0); }
      }

      /* ── Clip text reveal ── */
      @keyframes clip-left {
        from { clip-path: inset(0 100% 0 0); }
        to   { clip-path: inset(0 0% 0 0); }
      }
      .clip-reveal-text {
        clip-path: inset(0 100% 0 0);
        transition: clip-path 1s cubic-bezier(0.16, 1, 0.3, 1);
      }
      .clip-reveal-text.visible { clip-path: inset(0 0% 0 0); }

      /* ── Premium shimmer on hover ── */
      @keyframes shimmer-pass {
        from { background-position: -200% center; }
        to   { background-position: 200% center; }
      }
      .shimmer-hover {
        background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.08) 50%, transparent 100%);
        background-size: 200% 100%;
        background-position: -200% center;
        transition: background-position 0s;
      }
      .shimmer-hover:hover { animation: shimmer-pass 0.7s ease forwards; }
    </style>
    <link rel="stylesheet" href="/index.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
